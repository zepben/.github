name: Maven Lib Dev Release

on: 
  workflow_call:
    inputs:
      java-major-version:
        description: The major version of Java required by the project. This influences the container used to build the package
        required: false
        type: string
        default: "11"

    secrets:
      DEV_NEXUS_MAVEN_REPO:
        required: true
      DEV_NEXUS_USERNAME:
        required: true
      DEV_NEXUS_PASSWORD:
        required: true
      NEXUS_SIGNATURE:
        required: true
      DEV_NEXUS_MAVEN_SNAPSHOT:
        required: true
      DEV_NEXUS_MAVEN_RELEASE:
        required: true

jobs:

  deploy:
    runs-on: ubuntu-latest
    container: zepben/pipeline-java-ewb:${{ inputs.java-major-version }}-latest
    steps:
      - uses: actions/checkout@v7

       # Checkout the .github repo itself, into a subfolder
      - name: Checkout .github repo
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: central

      - name: Work around git permission issue
        run: |
          dname=$(echo ${{github.repository}} | cut -d'/' -f2)
          git config --global --add safe.directory /__w/$dname/$dname
        shell: sh

      - name: Cache maven deps
        uses: actions/cache@v6
        with:
          path: /maven
          key: maven

      - name: Update dev version
        run: |
          shopt -s nocasematch
          version=$(xmlstarlet pyx pom.xml | grep -v ^A | xmlstarlet p2x | xmlstarlet sel -t -v "/project/version")

          # Clickup Ticket regex 
          ticket=$(python3 central/tools/fetch-ticket-sha.py)
          new_version=$version-$ticket    
          xmlstarlet ed -P -L -N pom="http://maven.apache.org/POM/4.0.0" -u "/pom:project/pom:version" -v "$new_version" pom.xml
          echo "Updated pom.xml with a new dev version: $new_version"

          # # If the deployment is supported, deploy it
          # xmlstarlet ed -P -L -N pom="http://maven.apache.org/POM/4.0.0" \
          #   -u "/pom:project/pom:distributionManagement/pom:repository/pom:id" -v "zepben-maven-dev" \
          #   -u "/pom:project/pom:distributionManagement/pom:repository/pom:name" -v "Zepben Dev Repository" \
          #   -u "/pom:project/pom:distributionManagement/pom:repository/pom:url" -v "\${dev.releases.url}" \
          #   -u "/pom:project/pom:distributionManagement/pom:snapshotRepository/pom:id" -v "zepben-maven-dev" \
          #   -u "/pom:project/pom:distributionManagement/pom:snapshotRepository/pom:name" -v "Zepben Dev Repository" \
          #   -u "/pom:project/pom:distributionManagement/pom:snapshotRepository/pom:url" -v "\${dev.snapshots.url}" pom.xml
          # echo "Switched deployment to dev nexus"
        shell: bash

      - name: Maven deploy to dev Nexus
        id: build
        uses: zepben/maven-deploy-central-action@DEV-10233-dev-deploy
        with:
          NEXUS_MAVEN_REPO: ${{ secrets.NEXUS_MAVEN_REPO }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_RELEASE_URL: ${{ secrets.NEXUS_MAVEN_RELEASE }}
          NEXUS_SNAPSHOT_URL: ${{ secrets.NEXUS_MAVEN_SNAPSHOT }}
          DEV_NEXUS_MAVEN_REPO: ${{ secrets.DEV_NEXUS_MAVEN_REPO }}
          DEV_NEXUS_USERNAME: ${{ secrets.DEV_NEXUS_USERNAME }}
          DEV_NEXUS_PASSWORD: ${{ secrets.DEV_NEXUS_PASSWORD }}
          DEV_NEXUS_RELEASE_URL: ${{ secrets.DEV_NEXUS_MAVEN_RELEASE }}
          DEV_NEXUS_SNAPSHOT_URL: ${{ secrets.DEV_NEXUS_MAVEN_SNAPSHOT }}
          PROFILE: zepben-maven-dev
          DEV_ONLY: yes
