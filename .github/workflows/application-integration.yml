name: Application Integration

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the integration job
        type: string
        default: ubuntu-24.04
    secrets:
      NEXUS_MAVEN_REPO:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true
      NEXUS_SIGNATURE:
        required: true
      CI_GITHUB_TOKEN:
        required: true
      CI_NPM_TOKEN:
        required: false
      NEXUS_NPM_REPO:
        required: false

permissions:
  contents: read

jobs:
  integration-test:
    # github.* is the caller's context, so this is one run per caller workflow and ref
    # (each pull request has its own refs/pull/<n>/merge).
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    env:
      # Be explicit, this is the default on the runners anyway
      KIND_EXPERIMENTAL_PROVIDER: docker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the local chart's version comes from `git describe --tags`
          persist-credentials: false

      # The Makefile creates its venv with python3.14 and installs zep-dev into it. The
      # Makefile holds the zep-dev pin, so it keys both zep-dev caches.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Makefile

      # `zep-dev tools install` skips tools whose recorded hash matches, so an older
      # cache (restore-keys) still saves every download that did not change.
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/${{ github.event.repository.name }}
          key: zep-dev-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: zep-dev-tools-${{ runner.os }}-

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "17"
          cache: maven

      # ~/.m2/settings.xml: the image build's `maven` secret and the tests' Nexus access.
      - uses: zepben/maven-login@main
        with:
          maven-repo-url: ${{ secrets.NEXUS_MAVEN_REPO }}
          server-username: ${{ secrets.NEXUS_USERNAME }}
          server-password: ${{ secrets.NEXUS_PASSWORD }}
          nexus-signature: ${{ secrets.NEXUS_SIGNATURE }}

      # ~/.npmrc: the image build's `npm` secret, as release writes it.
      - name: Login to NPM
        env:
          NPM_TOKEN: ${{ secrets.CI_NPM_TOKEN }}
          NPM_REPO: ${{ secrets.NEXUS_NPM_REPO }}
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] || exit 0
          {
            echo "@zepben:registry=https://${NPM_REPO}"
            echo "//${NPM_REPO}/:_authToken=${NPM_TOKEN}"
            echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}"
          } > ~/.npmrc

      # ~/.docker/config.json: zep-dev's GHCR credential for charts and the pull secret.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CI_GITHUB_TOKEN }}

      - run: make integration-test
        env:
          CI_DUMP_DEBUG: "1" # print a cluster dump if Environment provisioning fails
