name: CSharp Build App
 
on: 
  workflow_call:
    inputs:
      test_files:
        description: 'Test dll output files separated by space.'
        required: false
        default: ''
        type: string
      sourcepath:
        description: 'Path to source directory (used for licence check)'
        required: false
        type: string
        default: "src"
      configurations:
        description: 'Configurations'
        required: false
        type: string
        default: '["Release"]'
      platforms:
        description: 'Platforms'
        required: false
        type: string
        default: '["x64"]'
    secrets:
      CI_GITHUB_TOKEN:
        required: true
      NEXUS_USERNAME:
        required: false
      NEXUS_PASSWORD: 
        required: false
      LC_URL: 
        required: false

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
 
jobs:
  check-for-leaks:
    uses: ./.github/workflows/check-git-leaks.yml
    secrets: inherit

  check-docs:
    uses: ./.github/workflows/check-docs.yml
    secrets: inherit

  check-licence:
    runs-on: ubuntu-latest
    container: zepben/pipeline-basic
    outputs: 
      docs-present: ${{ steps.docs.outputs.present }}
    env:
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ env.GITHUB_TOKEN }}

      - name: Cache licence-check
        uses: actions/cache@v6
        with:
          path: /lc
          key: lcc

      - name: Check licence
        uses: zepben/licence-check-action@main
        with:
          LC_URL: ${{ secrets.LC_URL }}
          PATH: ${{ inputs.sourcepath }}

  build-and-test:
    needs: check-licence
    runs-on: windows-2025
    strategy:
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
        configuration: ${{ fromJson(inputs.configurations) }}
    env:
      DEBUG: ${{ secrets.DEBUG }}
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ env.GITHUB_TOKEN }}

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4
     
    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v3

      # Keep this - it's to only set up vstest, 
      # it doesn't actually deploy it - it uses the one in container
      # so basically, it's using container-latest
    - name: Setup VSTest Path
      uses: darenm/Setup-VSTest@v1.1.1

    - name: Add ZepBen Nuget Repo credentials
      run: nuget sources update -Name "ZepBen" -username "${{ secrets.NEXUS_USERNAME }}" -password "${{ secrets.NEXUS_PASSWORD }}" -configFile "Nuget.Config"

    - name: Setup nuget cache
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
        restore-keys: |
          nuget-

    - name: Restore NuGet Packages
      run:   
        msbuild /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /t:restore

    - name: Build
      run: msbuild /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

    - name: Test
      if: ${{ inputs.test_files != '' }}
      run: vstest.console.exe ${{ inputs.test_files }} /Platform:${{ matrix.platform }}

  build-docs:
    needs: [check-docs, check-licence]
    if: ${{ needs.check-docs.outputs.docs-present == 'yes' }}
    uses: ./.github/workflows/build-docs.yml
    secrets: inherit
