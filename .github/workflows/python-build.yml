name: Build

on:
  workflow_call:
    inputs:
      sourcepath:
        description: 'Path to source directory (used for licence check)'
        required: false
        type: string
        default: "src"
      docker-container:
        description: "Docker container to run as part of build"
        required: false
        type: string
      docker-compose-env:
        description: "env to set for docker compose as a JSON string"
        required: false
        type: string
        default: "{}"
      python-versions-to-test:
        description: "List of versions of python to run, as a JSON string"
        required: false
        type: string
        default: "['3.10']"
    secrets:
      LC_URL: 
        required: false

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-for-leaks:
    uses: ./.github/workflows/check-git-leaks.yml
    secrets: inherit

  check-docs:
    uses: ./.github/workflows/check-docs.yml
    secrets: inherit

  run-checks:
    runs-on: ubuntu-latest
    container: zepben/pipeline-basic
    needs: check-for-leaks
    env:
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}

    steps:

      - uses: actions/checkout@v7

      - name: Work around git permission issue
        run: |
          dname=$(echo ${{github.repository}} | cut -d'/' -f2)
          git config --global --add safe.directory /__w/$dname/$dname
        shell: sh

      - name: Cache licence-check
        uses: actions/cache@v6
        with:
          path: /lc
          key: lcc

      - name: Fix workspace ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check licence
        uses: zepben/licence-check-action@main
        with:
          LC_URL: ${{ secrets.LC_URL }}
          PATH: ${{ inputs.sourcepath }}

  build-and-test:
    runs-on: ubuntu-latest
    needs: [check-for-leaks, run-checks]
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions-to-test) }}
    env:
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'

      - name: Install dependencies
        run: |
          pip install tox

      - name: Work around git permission issue
        run: |
          dname=$(echo ${{github.repository}} | cut -d'/' -f2)
          git config --global --add safe.directory /__w/$dname/$dname
        shell: sh

      - name: Login to Docker Hub
        if: inputs.docker-container != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Stand up required service containers, and run code generation
        if: inputs.docker-container != ''
        env: ${{ fromJSON(inputs.docker-compose-env) }}
        run: |
          docker compose up ${{ inputs.docker-container }}

      - name: Build and test
        run: |
          tox -e py${{ matrix.python-version }}
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  build-docs:
    needs: [check-docs]
    if: ${{ needs.check-docs.outputs.docs-present == 'yes' }}
    uses: ./.github/workflows/build-docs.yml
    secrets: inherit
