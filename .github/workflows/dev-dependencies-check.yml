name: Internal Dependency Check

on: 
  workflow_call:
    inputs:
      java-major-version:
        description: The major version of Java required by the project. This influences the container used to build the package
        required: false
        type: string
        default: "17"
      lang:
        description: The project build tool (npm, maven)
        required: true
        type: string
        default: maven

jobs:
  check-if-dev:
    runs-on: ubuntu-latest
    container: zepben/pipeline-java-ewb:${{ inputs.java-major-version }}-latest
    env:
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
      DEV_NEXUS_MAVEN_REPO: ${{ secrets.DEV_NEXUS_MAVEN_REPO }}
      DEV_NEXUS_USERNAME: ${{ secrets.DEV_NEXUS_USERNAME }}
      DEV_NEXUS_PASSWORD: ${{ secrets.DEV_NEXUS_PASSWORD }}
      NEXUS_NPM_REPO: ${{ secrets.DEV_NEXUS_NPM_REPO }}
      CI_NPM_TOKEN: ${{ secrets.CI_NPM_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
       # Checkout the .github repo itself, into a subfolder
      - name: Checkout .github repo
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: central


      - name: Work around git permission issue
        run: |
          dname=$(echo ${{github.repository}} | cut -d'/' -f2)
          git config --global --add safe.directory /__w/$dname/$dname
        shell: sh

      - name: Check if there are maven dev dependencies
        shell: bash
        run: |
          shopt -s nocasematch
          msg=$(python3 central/.github/actions/internal/get_dependencies.py --mode ${{ inputs.lang }})
          if [ ! -z "$msg" ]; then
            # Found dev dependencies, no need to build-and-test
            echo "Found dev dependencies, skipping project build"
            echo -e "$msg" | gh pr comment ${{ github.event.pull_request.number }} --body-file -
            exit 1
          fi
