name: Internal Dependency Check

on: 
  workflow_call:
    inputs:
      java-major-version:
        description: The major version of Java required by the project. This influences the container used to build the package
        required: false
        type: string
        default: "17"
      lang:
        description: The project build tool (npm, maven)
        required: true
        type: string
        default: maven

    outputs:
      should_build: 
        value: ${{ jobs.check-if-dev.outputs.should_build }}

jobs:
  check-if-dev:
    runs-on: ubuntu-latest
    container: zepben/pipeline-java-ewb:${{ inputs.java-major-version }}-latest
    env:
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
      DEV_NEXUS_MAVEN_REPO: ${{ secrets.DEV_NEXUS_MAVEN_REPO }}
      DEV_NEXUS_USERNAME: ${{ secrets.DEV_NEXUS_USERNAME }}
      DEV_NEXUS_PASSWORD: ${{ secrets.DEV_NEXUS_PASSWORD }}
      NEXUS_NPM_REPO: ${{ secrets.DEV_NEXUS_NPM_REPO }}
      CI_NPM_TOKEN: ${{ secrets.CI_NPM_DEV_TOKEN }}
    outputs:
      should_build: ${{ steps.test.output.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ env.GITHUB_TOKEN }}

      - name: Work around git permission issue
        run: |
          dname=$(echo ${{github.repository}} | cut -d'/' -f2)
          git config --global --add safe.directory /__w/$dname/$dname
        shell: sh

      - name: Check if there are maven dev dependencies
        id: test
        shell: bash
        run: |
          if [ "${{ inputs.lang }}" == "maven" ]; then
            # Get the dependencies
            out=$(mvn dependency:list -DincludeGroupIds=com.zepben -B \
              -P 'zepben-maven' \
              -f pom.xml \
              -Dserver.username=$DEV_NEXUS_USERNAME \
              -Dserver.password=$DEV_NEXUS_PASSWORD \
              -Dserver.repo.url=$DEV_NEXUS_MAVEN_REPO | grep -F ':jar' | grep -F -e "-dev-")
            res=$?
          elif [ "${{ inputs.lang }}" == "npm" ]; then
            out=$(grep -F "@zepben" package.json | grep -F -e "-dev-")
            res=$?
          else
            echo "Provided lang '${{ inputs.lang }}' is currently unsupported!"
            echo "should_build=yes" >> "${GITHUB_OUTPUT}"
            exit
          fi

          if [[ $res == 0 ]]; then
            # Found dev dependencies, no need to build-and-test
            echo "Found dev dependencies, skipping project build"
            echo -e "Found dev dependencies; build skipped:\n\n${out[@]}" | gh pr comment ${{ github.event.pull_request.number }} --body-file -
          else
            # No dev dependencies, carry on
            echo "should_build=yes" >> "${GITHUB_OUTPUT}"
          fi
