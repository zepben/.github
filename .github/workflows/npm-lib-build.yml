name: NPM Lib Build

on:
  workflow_call:
    inputs:
      sourcepath:
        description: 'Path to source directory (used for licence check)'
        required: false
        type: string
        default: "src"
    secrets:
      NEXUS_NPM_REPO:
        required: true
      CI_NPM_TOKEN:
        required: true
      CI_GITHUB_TOKEN:
        required: true
      LC_URL:
        required: false

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-for-leaks:
    uses: ./.github/workflows/check-git-leaks.yml
    secrets: inherit

  check-docs:
    uses: ./.github/workflows/check-docs.yml
    secrets: inherit

  build-and-test:
    runs-on: ubuntu-latest
    container: node:24-alpine
    continue-on-error: false
    env:
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
    steps:
      - name: Install Dependencies
        run: |
          apk add jq tar alpine-conf git curl bash github-cli python3

      - uses: actions/checkout@v7

      - name: Check dev dependencies
        uses: $/.github/actions/check-dev-dependency
        with:
          lang: npm

      - name: Cache nodejs deps
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-

      - name: Cache licence-check
        uses: actions/cache@v6
        with:
          path: /lc
          key: lcc

      - name: Check licence
        uses: zepben/licence-check-action@main
        with:
          LC_URL: ${{ secrets.LC_URL }}
          PATH: ${{ inputs.sourcepath }}

      - name: Set timezone to Australia/ACT
        run: |
          setup-timezone -z Australia/ACT

      - name: create .npmrc
        run: |
          rm -rf .npmrc
          echo "@zepben:registry=https://${{ secrets.NEXUS_NPM_REPO }}/" >> .npmrc
          echo "//${{ secrets.NEXUS_NPM_REPO }}/:_authToken=${{ secrets.CI_NPM_TOKEN }}" >> .npmrc
          echo "\n" >> .npmrc

      - name: Build and test
        run: |
          echo "NPM is sensitive to .npmrc formatting; check that it has a newline at the end!!!"
          npm ci --unsafe-perm
          npm run ci

  build-docs:
    needs: [check-docs]
    if: ${{ needs.check-docs.outputs.docs-present == 'yes' }}
    uses: ./.github/workflows/build-docs.yml
    secrets: inherit
