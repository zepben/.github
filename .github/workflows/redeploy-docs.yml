name: Redeploy docs again without version bump

on:
  workflow_call:
    secrets:
      CI_GITHUB_TOKEN:
        required: true

jobs:

  # Only proceed if on the same SHA as when started
  check-docs:
    uses: ./.github/workflows/check-docs.yml
    secrets: inherit

  build-docs:
    needs: [check-docs]
    if: ${{ needs.check-docs.outputs.docs-present == 'yes' }}
    uses: ./.github/workflows/build-docs.yml
    with:
      DEPLOY: true
    secrets: inherit

  deploy-docs:
    needs: [build-docs]
    if: ${{ needs.build-docs.outputs.artifact != '' }}
    uses: ./.github/workflows/deploy-docs.yml
    with:
      PRODUCT: ${{ needs.build-docs.outputs.product }}
      ARTIFACT: ${{ needs.build-docs.outputs.artifact }}
    secrets: inherit
