# Reusable release workflow for Helm charts under helm_dir (default: helm/).
# Pushes releases. We expect tests etc passed on the PR workflow.
name: Helm Charts Release

on:
  workflow_call:
    inputs:
      helm_dir:
        description: Path to the helm directory containing ct.yaml and charts/
        type: string
        default: helm
      oci_repo:
        description: OCI repository prefix beneath ghcr.io
        type: string
        default: zepben/charts
      ci_utils_ref:
        description: Git ref of zepben/ci-utils for zep-dev install
        type: string
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: helm-chart-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  list-changed:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup zep-dev
        # Relative ./.github/actions resolves to the *caller* workspace (e.g. deployments),
        # not this reusable-workflow repo so must use an absolute org/repo@ref.
        uses: zepben/.github/.github/actions/setup-zep-dev@main
        with:
          ci_utils_ref: ${{ inputs.ci_utils_ref }}

      - name: List changed charts
        id: detect
        run: |
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before=HEAD~1
          fi
          charts=$(zep-dev chart list-changed \
            --helm-dir "${{ inputs.helm_dir }}" \
            --since "$before")
          echo "charts=$charts" >> "$GITHUB_OUTPUT"
          echo "Changed charts (since $before): $charts"

  release:
    needs: list-changed
    if: needs.list-changed.outputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.list-changed.outputs.charts) }}
    env:
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ env.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup zep-dev
        uses: zepben/.github/.github/actions/setup-zep-dev@main
        with:
          ci_utils_ref: ${{ inputs.ci_utils_ref }}

      - name: Helm registry login
        uses: zepben/.github/.github/actions/helm-registry-login@main
        with:
          token: ${{ env.GITHUB_TOKEN }}

      - name: Push chart
        env:
          OCI_REPO: ${{ inputs.oci_repo }}
        run: |
          zep-dev chart push \
            --chart "${{ matrix.chart }}" \
            --registry-config "$HELM_REGISTRY_CONFIG" \
            --oci-repo "$OCI_REPO"
