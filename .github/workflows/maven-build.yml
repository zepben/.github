name: Maven Build

on: 
  workflow_call:
    inputs:
      sourcepath:
        description: 'Path to source directory (used for licence check)'
        required: false
        type: string
        default: "src"
      java-major-version:
        description: The major version of Java required by the project. This influences the container used to build the package
        required: false
        type: string
        default: "11"

    secrets:
      NEXUS_MAVEN_REPO:
        required: true
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true
      NEXUS_SIGNATURE:
        required: true
      LC_URL: 
        required: false

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-for-leaks:
    uses: ./.github/workflows/check-git-leaks.yml
    secrets: inherit

  check-docs:
    uses: ./.github/workflows/check-docs.yml
    secrets: inherit

  build-and-test:
    runs-on: ubuntu-latest
    container: zepben/pipeline-java-ewb:${{ inputs.java-major-version }}-latest
    env:
      # TOKEN is needed for the licence checked - there's a gh cli running and it requires the token to parse repos
      GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
      NEXUS_MAVEN_REPO: ${{ secrets.NEXUS_MAVEN_REPO }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_SIGNATURE: ${{ secrets.NEXUS_SIGNATURE }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Check dev dependencies
        uses: $/.github/actions/check-dev-dependency
        with:
          lang: maven

      - name: Cache licence-check
        uses: actions/cache@v6
        with:
          path: /lc
          key: lcc

      - name: Check licence
        uses: zepben/licence-check-action@main
        with:
          LC_URL: ${{ secrets.LC_URL }}
          PATH: ${{ inputs.sourcepath }}

      - name: Check the snapshot version
        shell: bash {0}
        run: |
          xmlstarlet pyx pom.xml | grep -v ^A | xmlstarlet p2x | xmlstarlet sel -t -v "/project/version" | grep SNAPSHOT
          if [ $? = 0 ]; then
            echo "This project has a '-SNAPSHOT' in its version number. Replace it with 'b'" 
            exit 1
          fi

      - name: Cache maven deps
        uses: actions/cache@v6
        with:
          path: /maven
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Maven build and test
        id: build
        run: |
          mvn clean test -B -f pom.xml -Dserver.username=$NEXUS_USERNAME -Dserver.password=$NEXUS_PASSWORD -Dserver.repo.url=$NEXUS_MAVEN_REPO -Dnexus.signature=$NEXUS_SIGNATURE 
        shell: bash

      - name: Upload coverage to Codecov
        if: steps.build.outcome == 'success'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true


  build-docs:
    needs: [check-docs]
    if: ${{ needs.check-docs.outputs.docs-present == 'yes' }}
    uses: ./.github/workflows/build-docs.yml
    secrets: inherit
