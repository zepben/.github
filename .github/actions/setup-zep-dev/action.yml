name: Setup zep-dev
description: Install zep-dev using the existing Python in an isolated virtualenv, optionally with managed tools.

inputs:
  ci_utils_ref:
    description: Utility revision selected by the calling action or workflow
    required: false
    default: 'zep-dev-pre-refactor'
  install-tools:
    description: Install managed tools and add their paths; false returns only the CLI executable
    required: false
    default: 'true'

outputs:
  executable:
    description: Absolute path to zep-dev in the installed virtualenv
    value: ${{ steps.install.outputs.executable }}

runs:
  using: composite
  steps:
    - name: Cache zep-dev tools
      if: inputs.install-tools == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.local/share/${{ github.event.repository.name }}
        key: zep-dev-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ci_utils_ref }}

    - name: Cache pip downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: zep-dev-pip-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ci_utils_ref }}

    - name: Install zep-dev
      id: install
      shell: bash
      env:
        CI_UTILS_REF: ${{ inputs.ci_utils_ref }}
        INSTALL_TOOLS: ${{ inputs.install-tools }}
      run: |
        set -euo pipefail
        # Keep the venv's parent name consistent with the managed-tool cache.
        install_root=$(mktemp -d "$RUNNER_TEMP/zep-dev.XXXXXX")
        venv="$install_root/${GITHUB_REPOSITORY##*/}/.venv"
        python3 -m venv "$venv"
        "$venv/bin/python" -m pip install "git+https://github.com/zepben/ci-utils.git@${CI_UTILS_REF}#subdirectory=zep-dev"
        printf 'executable=%s\n' "$venv/bin/zep-dev" >> "$GITHUB_OUTPUT"
        if [ "$INSTALL_TOOLS" = 'true' ]; then
          "$venv/bin/zep-dev" tools install
          printf '%s\n' "$("$venv/bin/zep-dev" tools path)" "$venv/bin" >> "$GITHUB_PATH"
        fi
