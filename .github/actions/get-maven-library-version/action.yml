name: Get Maven library version
description: Read the root Maven project version.

outputs:
  version:
    description: The effective root Maven project version.
    value: ${{ steps.extract.outputs.version }}

runs:
  using: composite
  steps:
    - id: extract
      shell: bash
      run: |
        version="$(python3 "$GITHUB_ACTION_PATH/../internal/get_version.py" --mode maven-library)"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "Extracted version: ${version}"
